name: Deploy ASO Toolkit - Production

on:
  # 支持手动触发部署，可指定分支（默认 master）
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to deploy"
        required: true
        default: "master"

# 确保同一时间只有一个部署进行
concurrency:
  group: deployment-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zoeleee/aso-toolkit
  APP_NAME: aso-toolkit-production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'master' }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production # 关键：使用 production 环境中的 Secrets

    steps:
      - name: Deploy to Production Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          script: |
            # 登录 GitHub Container Registry
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 创建部署及持久化数据目录
            mkdir -p ~/deployments/${{ env.APP_NAME }}/data

            # 创建 docker-compose.yml 文件
            cat > ~/deployments/${{ env.APP_NAME }}/docker-compose.yml << 'EOF'
            services:
              server:
                container_name: ${{ env.APP_NAME }}
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                restart: unless-stopped
                ports:
                  - "${{ secrets.APP_SERVER_PORT || '8501' }}:8501"
                volumes:
                  - ~/deployments/${{ env.APP_NAME }}/data:/app/data
                environment:
                  - APP_VERSION=${{ github.sha }}
                  - ASO_DB_PATH=/app/data/aso_data.db
                  - LLM_API_KEY=${{ secrets.LLM_API_KEY }}
                  - LLM_BASE_URL=${{ secrets.LLM_BASE_URL }}
                  - LLM_MODEL=${{ secrets.LLM_MODEL }}
                  - ASO_WEBHOOK_URL=${{ secrets.ASO_WEBHOOK_URL }}
                networks:
                  - ${{ env.APP_NAME }}-network

            networks:
              ${{ env.APP_NAME }}-network:
                driver: bridge
            EOF

            # 进入部署目录
            cd ~/deployments/${{ env.APP_NAME }}

            # 拉取最新镜像
            docker compose pull

            # 停止并移除旧容器
            docker compose down

            # 启动新容器
            docker compose up -d

            # 等待容器启动
            sleep 5

            # 检查运行状态
            docker compose ps

            # 清理旧镜像（保留当前版本和 latest）
            CURRENT_TAG="${{ github.sha }}"
            REPO="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
            docker images "$REPO" --format "{{.Tag}}" | while read tag; do
              if [ -n "$tag" ] && [ "$tag" != "<none>" ] && [ "$tag" != "$CURRENT_TAG" ] && [ "$tag" != "latest" ]; then
                echo "Removing old image: $REPO:$tag"
                docker rmi "$REPO:$tag" 2>/dev/null || true
              fi
            done
